<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="same-origin">
<title>Administración · Xebax</title><link rel="icon" href="../img/logo-xebax-mark.webp"><link rel="stylesheet" href="./resenas.css"><link rel="stylesheet" href="../cms/admin.css"><script type="module" src="./admin.js"></script></head>
<body class="cms-admin"><header class="mast"><a href="../" class="brand"><img src="../img/logo-xebax-mark.webp" alt=""> XEBAX</a><span>Administración</span><a href="../" target="_blank" rel="noopener">Ver sitio ↗</a></header>
<main>
<form id="login" class="login-card"><h1>Administrar mi sitio</h1><label for="username">Nombre de usuario</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary">Entrar al panel</button><a href="./recuperar.html">Crear o recuperar mi contraseña</a></form>
<div id="dashboard" hidden>
<div class="cms-bar"><div><span class="user-label">Mi perfil</span> <strong id="profile-username"></strong></div><div class="bar-actions"><span id="save-state" role="status"></span><button id="preview" hidden>Vista previa</button><button id="save" hidden>Guardar borrador</button><button id="publish" class="primary" hidden>Publicar</button><button id="logout">Cerrar sesión</button></div></div>
<div class="editor-shell"><nav id="cms-nav" aria-label="Administración"><button id="reviews-nav">Reseñas</button></nav>
<div class="editor-main"><section id="workspace" hidden aria-label="Editor de contenido"></section>
<section id="review-panel" class="xr" hidden><h1>Reseñas de viajeros</h1><div class="xr-tools"><label for="filter">Mostrar</label><select id="filter"><option value="pending">Pendientes</option><option value="published">Publicadas</option><option value="hidden">Ocultas</option></select><button id="refresh">Actualizar</button></div><div id="list"></div><button id="more" hidden>Ver más reseñas</button></section></div></div></div>
<p id="notice" role="status" aria-live="polite"></p></main>
<dialog id="preview-dialog"><div class="dialog-bar"><strong>Vista previa del borrador</strong><label><input id="visual-mode" type="checkbox"> Elegir contenido para editar</label><label>Página <select id="preview-page"></select></label><button data-close>Cerrar</button></div><iframe id="preview-frame" title="Vista previa del contenido"></iframe></dialog>
<dialog id="media-dialog"><div class="dialog-bar"><h2>Elegir archivo</h2><button data-close>Cerrar</button></div><div id="media-dialog-body"></div></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-body"></p><div class="bar-actions"><button value="cancel" autofocus>Cancelar</button><button value="ok" class="primary" id="confirm-ok">Confirmar</button></div></form></dialog>
</body></html>
